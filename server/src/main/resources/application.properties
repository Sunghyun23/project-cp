server.port=8000
server.tomcat.threads.max=8
server.tomcat.threads.min-spare=1
server.tomcat.max-connections=32
server.tomcat.accept-count=16
spring.application.name=camping-api
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/camping}
spring.datasource.username=${POSTGRES_USER:camping}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
# 기존 Django 테이블을 보존하면서 별도 스키마에 Flyway 이력을 관리한다.
spring.flyway.default-schema=cp_migrations
spring.flyway.schemas=cp_migrations
spring.flyway.clean-disabled=true
server.error.include-message=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
cp.google-client-id=${GOOGLE_CLIENT_ID:}
cp.web-origin=${CP_WEB_ORIGIN:http://localhost:8080}
cp.secure-cookies=${CP_SECURE_COOKIES:false}
