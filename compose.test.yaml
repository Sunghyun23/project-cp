name: project-cp-tests
services:
  db:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: camping_test
      POSTGRES_USER: camping
      POSTGRES_PASSWORD: isolated-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camping -d camping_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    image: maven:3.9.11-eclipse-temurin-21@sha256:6fdc855a6ed81d288ca7ca37ac6ff5e9308b612485c0801d70b25a858c83d237
    working_dir: /source
    volumes:
      - ./server:/source
      - maven-cache:/root/.m2
    environment:
      DB_URL: jdbc:postgresql://db:5432/camping_test
      POSTGRES_PASSWORD: isolated-test-only
    depends_on:
      db:
        condition: service_healthy
    command: ["mvn", "-B", "-ntp", "test"]
volumes:
  maven-cache:
