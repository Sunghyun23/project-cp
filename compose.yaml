name: project-cp
services:
  db:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: camping
      POSTGRES_USER: camping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - prototype-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camping -d camping"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./server
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx160m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m -XX:MaxDirectMemorySize=16m -Xss512k -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  web:
    image: caddy:2.10.2-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./builds/web:/srv:ro
    depends_on:
      - api
volumes:
  prototype-db:
